services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-academicflow}
      POSTGRES_USER: ${DB_USERNAME:-academicflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-academicflow}
    # Host mapping for local/dev only. On VPS keep Postgres on the internal network only.
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - af_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - af_internal

volumes:
  af_pg:

networks:
  af_internal:
    driver: bridge
