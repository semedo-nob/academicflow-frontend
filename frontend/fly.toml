app = "academicflow-frontend"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 80
  force_https = true
  # Keep the SPA warm so auth bootstrap does not race cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
