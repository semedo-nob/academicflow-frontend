# Production stack for Oracle Cloud Always Free ARM64 (Ampere A1).
# Frontend is hosted on Vercel — this compose runs API + Postgres + Nginx only.
#
# Usage on the VM:
#   cp .env.production.example .env
#   nano .env   # fill secrets; never commit .env
#   docker compose -f docker-compose.production.yml up -d --build
#
# Do NOT publish Postgres :5432 or Spring Boot :8081 to the public internet.
# Only Nginx :80 (and later :443) should be reachable from the VCN/security list.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - af_internal
    # No ports: — Postgres stays on the Docker network only.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: academicflow-api:production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_MODE: ${AUTH_MODE:-clerk}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_API_BASE: ${CLERK_API_BASE:-https://api.clerk.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      INVITATION_EXPIRY_HOURS: ${INVITATION_EXPIRY_HOURS:-336}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Platform Admin}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTAL_API_URL: ${POSTAL_API_URL:-}
      POSTAL_API_KEY: ${POSTAL_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - af_internal
    # No ports: — reach Spring only via Nginx on the same network.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      # After Let's Encrypt (manual): uncomment and mount certs
      # - "443:443"
    volumes:
      - ./deploy/oci/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - af_internal

volumes:
  postgres_data:
    name: academicflow_postgres_data

networks:
  af_internal:
    driver: bridge
