# Nginx reverse proxy for AcademicFlow API on Oracle Cloud.
# TLS / Let's Encrypt are configured later on the host — HTTP :80 only for now.
# Spring Boot listens on backend:8081 (Docker network). Do not publish 8081 publicly.

upstream academicflow_backend {
    server backend:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /actuator/health {
        proxy_pass http://academicflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://academicflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
