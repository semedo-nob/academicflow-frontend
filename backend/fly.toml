app = "academicflow-api"
primary_region = "lhr"

[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SERVER_PORT = "8081"
  AUTH_MODE = "clerk"
  EMAIL_PROVIDER = "resend"
  CLERK_ISSUER = "https://good-sheep-5688.clerk.accounts.dev"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "300s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
