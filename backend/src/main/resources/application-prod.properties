# Activate with SPRING_PROFILES_ACTIVE=prod (do not set spring.profiles.active here).
academicflow.auth.mode=${AUTH_MODE:clerk}
academicflow.email.provider=${EMAIL_PROVIDER:resend}
# Production must set DB_*, CLERK_*, CORS_ALLOWED_ORIGINS, APP_BASE_URL, RESEND_API_KEY / POSTAL_* via environment.

# Trust X-Forwarded-* from the Docker Nginx reverse proxy (HTTPS termination later).
server.forward-headers-strategy=framework
