spring.application.name=academicflow
server.port=${SERVER_PORT:8081}

# Prefer environment variables. For local Docker Postgres use profile `dev`
# (SPRING_PROFILES_ACTIVE=dev) or copy application-local.properties.example.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:academicflow}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

academicflow.default-tenant-id=${DEFAULT_TENANT_ID:11111111-1111-1111-1111-111111111111}
academicflow.version=1.0.0
academicflow.jwt-secret=${JWT_SECRET:}
academicflow.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

server.error.include-message=always

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=AcademicFlow
info.app.version=1.0.0

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
