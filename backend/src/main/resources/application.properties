spring.application.name=academicflow
server.port=${SERVER_PORT:8081}

# Prefer environment variables. For local Docker Postgres use profile `dev`
# (SPRING_PROFILES_ACTIVE=dev) or copy application-local.properties.example.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:academicflow}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

academicflow.default-tenant-id=${DEFAULT_TENANT_ID:11111111-1111-1111-1111-111111111111}
academicflow.version=1.0.0
academicflow.jwt-secret=${JWT_SECRET:}
academicflow.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
academicflow.app-base-url=${APP_BASE_URL:http://127.0.0.1:5173}
academicflow.invitation-expiry-hours=${INVITATION_EXPIRY_HOURS:336}
academicflow.email.provider=${EMAIL_PROVIDER:console}
academicflow.email.from=${EMAIL_FROM:}
academicflow.email.resend-api-key=${RESEND_API_KEY:}
academicflow.email.postal-api-url=${POSTAL_API_URL:}
academicflow.email.postal-api-key=${POSTAL_API_KEY:}

# Auth: auto = Clerk when keys present, otherwise legacy header auth (local/tests)
academicflow.auth.mode=${AUTH_MODE:auto}
academicflow.clerk.issuer=${CLERK_ISSUER:}
academicflow.clerk.jwks-url=${CLERK_JWKS_URL:}
academicflow.clerk.secret-key=${CLERK_SECRET_KEY:}
academicflow.clerk.api-base=${CLERK_API_BASE:https://api.clerk.com}
# Optional: promote/create SUPER_ADMIN by email on boot (no password — use Clerk for sign-in)
academicflow.super-admin-email=${SUPER_ADMIN_EMAIL:}
academicflow.super-admin-name=${SUPER_ADMIN_NAME:Platform Admin}

server.error.include-message=always

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=AcademicFlow
info.app.version=1.0.0

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
